name: Build APK - Mecanica G3
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
      - name: Instalar ferramentas Android
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK de teste
        run: gradle --no-daemon :app:assembleDebug
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Mecanica-G3-APK-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
